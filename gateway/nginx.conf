# Step 2 API gateway. The one public entry point (:8080). Routes the extracted contexts to their
# services and everything else to the monolith, so every UI page and API keeps its old URL.
worker_processes auto;
events { worker_connections 1024; }

http {
  # Trust an inbound X-Request-Id, else mint one ($request_id = 32 random hex chars).
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  log_format edemand '$remote_addr "$request" $status $body_bytes_sent '
                     'rid=$req_id traceparent="$http_traceparent" upstream=$upstream_addr rt=$request_time';
  access_log /dev/stdout edemand;
  error_log  /dev/stderr warn;

  upstream monolith      { server edemand:3000;       keepalive 16; }
  upstream notifications { server notifications:4001; keepalive 16; }
  upstream payments      { server payments:4002;      keepalive 16; }

  server {
    listen 8080;
    client_max_body_size 1m;

    # Inherited by every location below (none of them sets its own proxy_set_header).
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Request-Id      $req_id;
    proxy_set_header traceparent       $http_traceparent;   # W3C trace context, passed through untouched
    proxy_set_header tracestate        $http_tracestate;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- Notifications service ----
    location =  /api/notifications  { proxy_pass http://notifications; }
    location ^~ /api/notifications/ { proxy_pass http://notifications; }

    # ---- Payments & Wallet service ----
    location ^~ /api/payments/            { proxy_pass http://payments; }
    location =  /api/provider/wallet      { proxy_pass http://payments; }
    location =  /api/customer/transactions { proxy_pass http://payments; }

    # Service-to-service endpoints are never reachable from outside.
    location ^~ /api/internal/ { return 404; }

    location = /gateway/health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # ---- Everything else: the monolith (UI pages + remaining APIs) ----
    location / { proxy_pass http://monolith; }
  }
}
