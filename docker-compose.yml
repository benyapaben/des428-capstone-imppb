name: edemand

# Step 2 — Area A: Notifications and Payments & Wallet extracted, behind an nginx gateway.
#   docker compose up -d --wait          -> http://localhost:8080 (gateway; every old URL still works)
#   docker compose --profile test run --rm test                 (monolith suite, in-memory, no deps)
#   docker compose --profile test run --rm notifications-test   (needs test-db)
#   docker compose --profile test run --rm payments-test        (needs test-db)
# Step 6 — Area E: Jaeger http://localhost:16686 · Prometheus http://localhost:9090 ·
#   Grafana http://localhost:3001 (admin / admin)

x-shared-env: &shared-env
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-edemand-internal-token}

# Step 3: how every process verifies a user's Keycloak token (issuer pinned in the keycloak service
# below). There is no shared JWT secret any more: Keycloak alone holds the signing key.
x-keycloak-env: &keycloak-env
  KEYCLOAK_ISSUER: http://localhost:8081/realms/edemand
  JWKS_URL: http://keycloak:8080/realms/edemand/protocol/openid-connect/certs

x-pg-health: &pg-health
  test: ["CMD-SHELL", "pg_isready -U postgres"]
  interval: 5s
  timeout: 3s
  retries: 20

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      edemand: { condition: service_healthy }
      notifications: { condition: service_healthy }
      payments: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/gateway/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # The monolith (Identity, Catalog, Providers, Booking, Bidding, Reviews + events outbox). SQLite.
  edemand:
    build:
      context: .
      target: runtime
    environment:
      PAYMENT_TIMEOUT_SECONDS: ${PAYMENT_TIMEOUT_SECONDS:-900}
      <<: [*shared-env, *keycloak-env]
      KEYCLOAK_URL: http://keycloak:8080   # login (token endpoint) + registration (admin API)
      JWT_AUDIENCE: edemand-api
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-edemand-backend-secret}
      PAYMENTS_URL: http://payments:4002
      NOTIFICATIONS_URL: http://notifications:4001
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      keycloak: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports:
      - "3000:3000"   # direct access for debugging only — browse through the gateway on :8080
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  notifications:
    build:
      context: ./services/notifications
      target: runtime
    environment:
      <<: [*shared-env, *keycloak-env]
      JWT_AUDIENCE: notifications-api
      DATABASE_URL: postgres://postgres:postgres@notif-db:5432/notif_db
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      notif-db: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  payments:
    build:
      context: ./services/payments
      target: runtime
    environment:
      <<: [*shared-env, *keycloak-env]
      JWT_AUDIENCE: payments-api
      DATABASE_URL: postgres://postgres:postgres@pay-db:5432/pay_db
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-edemand-webhook-secret}
      EVENT_SUBSCRIBERS: http://edemand:3000/api/internal/events,http://notifications:4001/internal/events
      SEED_PROVIDER_IDS: "1,2,3"
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      pay-db: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  notif-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notif_db
      POSTGRES_PASSWORD: postgres
    healthcheck: *pg-health

  pay-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pay_db
      POSTGRES_PASSWORD: postgres
    healthcheck: *pg-health


  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]   # 15672 = web UI, guest / guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12


  # Step 3 — Area B: identity provider (realm: deploy/keycloak/edemand-realm.json, re-imported on
  # every boot like the monolith's reseed). The issuer is pinned to http://localhost:8081 so a token
  # fetched from inside the network (http://keycloak:8080) and one fetched from the host carry the
  # same `iss`. JWKS for services: http://keycloak:8080/realms/edemand/protocol/openid-connect/certs
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/edemand-realm.json:/opt/keycloak/data/import/edemand-realm.json:ro
    ports:
      - "8081:8080"   # admin console: http://localhost:8081/admin (admin / admin)
    healthcheck:
      # The image has no curl/wget: talk HTTP to the management port (9000) over bash /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  # ---------------- Step 6 — Area E: observability ----------------
  # Apps send traces over OTLP/HTTP straight to Jaeger (http://jaeger:4318) — no OTel Collector at
  # our size. Prometheus scrapes each app's /metrics; Grafana reads both. Configs: deploy/observability/.
  # Nothing here is a dependency of the apps: a missing tracer or scraper must never stop a request.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "5000"     # in-memory storage, capped so it cannot eat the 8 GB budget
    ports:
      - "16686:16686"               # UI: http://localhost:16686 (4318 OTLP stays inside the network)
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:14269/"]   # admin port: 200 when serving
      interval: 10s
      timeout: 3s
      retries: 6

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"                 # UI + targets: http://localhost:9090/targets
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"     # the marker can open the dashboard without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"   # offline: no calls home
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"    # 11.x otherwise tries to download plugins on boot
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"                 # http://localhost:3001 (admin / admin); :3000 is the monolith
    depends_on:
      prometheus: { condition: service_healthy }
      jaeger: { condition: service_healthy }
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

  # ---------------- tests ----------------
  # Boots its own in-memory database and fakes the two services (test-helpers/fakeServices.js).
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    command: ["npm", "test"]

  test-db:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./deploy/test-db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck: *pg-health

  notifications-test:
    profiles: ["test"]
    build:
      context: ./services/notifications
      target: test
    environment:
      DATABASE_URL: postgres://postgres:postgres@test-db:5432/notif_test
    depends_on:
      test-db: { condition: service_healthy }

  payments-test:
    profiles: ["test"]
    build:
      context: ./services/payments
      target: test
    environment:
      DATABASE_URL: postgres://postgres:postgres@test-db:5432/pay_test
    depends_on:
      test-db: { condition: service_healthy }
